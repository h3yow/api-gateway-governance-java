# =====================================================================
# API 治理层配置
# =====================================================================

# ---- 限流 / 配额（固定窗口 + 令牌桶，两个维度：路由 / 调用方）----
# 全局默认规则（-1 表示该语义不启用）
governance.rate-limit.defaults.window-quota=100
governance.rate-limit.defaults.window-millis=60000
governance.rate-limit.defaults.burst-capacity=20
governance.rate-limit.defaults.refill-per-second=10

# 路由级覆盖：orders 路由窗口更小（60 次/分钟），突发 10
governance.rate-limit.routes.orders.window-quota=60
governance.rate-limit.routes.orders.window-millis=60000
governance.rate-limit.routes.orders.burst-capacity=10
governance.rate-limit.routes.orders.refill-per-second=5

# 调用方级覆盖示例：vip 调用方拥有更高配额（可按需放开）
governance.rate-limit.callers.vip.window-quota=1000
governance.rate-limit.callers.vip.burst-capacity=100
governance.rate-limit.callers.vip.refill-per-second=50

# ---- 失败处理 / 重试（仅超时与连接失败重试；写操作必须携带幂等键）----
governance.retry.max-attempts=3
governance.retry.backoff-millis=20
