# 应用
spring.application.name=api-gateway-governance
server.port=8080

# 治理层配置
# 调用方维度限流：每个窗口（窗口速率语义）+ 突发额度（令牌桶容量增量）
governance.caller.window-limit=10
governance.caller.window=1s
governance.caller.burst-capacity=0
# 服务路由维度限流
governance.route.window-limit=20
governance.route.window=1s
governance.route.burst-capacity=5
# 安全重试：读操作可重试超时/连接失败，写操作仅重试连接失败
governance.retry.read-max-attempts=3
governance.retry.write-max-attempts=2
governance.retry.backoff-millis=10
